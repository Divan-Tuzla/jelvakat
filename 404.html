<!DOCTYPE html>
<html lang="bs" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#070F22"/>
<meta name="color-scheme" content="dark"/>
<title>Stranica nije pronađena · Jel' vakat?</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100vh;background:#070F22;color:#E8DCC4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
  .num{font-size:5rem;font-weight:300;letter-spacing:0.05em;color:#D4AF37;margin:0;line-height:1;font-variant-numeric:lining-nums}
  h1{font-size:1.4rem;font-weight:400;margin:18px 0 10px;color:#E8DCC4;letter-spacing:0.01em}
  p{font-size:1rem;line-height:1.55;color:rgba(232,220,196,0.7);max-width:34ch;margin:0 0 32px}
  a{display:inline-block;padding:12px 28px;border:1px solid rgba(212,175,55,0.5);border-radius:999px;color:#D4AF37;text-decoration:none;font-size:0.95rem;letter-spacing:0.02em;transition:background 0.2s,border-color 0.2s}
  a:hover,a:focus{background:rgba(212,175,55,0.1);border-color:rgba(212,175,55,0.8);outline:none}
</style>
</head>
<body>
<p class="num">404</p>
<h1>Stranica nije pronađena</h1>
<p>Adresa koju si upisao ne postoji. Možda je pogrešno otkucana ili je stranica premještena.</p>
<a href="/">Nazad na početnu</a>
</body>
</html>
